name: Publish live water levels without Git commits

on:
  workflow_dispatch:
    inputs:
      bootstrap:
        description: "Only for first deployment before the live Pages files exist"
        type: boolean
        default: false
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: publish-live-water-levels
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout archive repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install source dependencies
        run: python -m pip install -r fetcher/requirements.txt
      - name: Restore last published rolling state
        env:
          BOOTSTRAP: ${{ inputs.bootstrap }}
        run: |
          if [ "$BOOTSTRAP" = "true" ]; then
            python scripts/live_site.py prepare --viewer fetcher --bootstrap
          else
            python scripts/live_site.py prepare --viewer fetcher
          fi
      - name: Fetch observations from Kawabou (once per hour, 1 request per station)
        working-directory: fetcher
        run: |
          python scripts/update_recent_from_kawabou_files.py --keep-10min-hours 168 --keep-hourly-days 45
      - name: Validate and package small live site
        run: python scripts/live_site.py package --viewer fetcher
      - name: Merge recent hourly readings into annual archives
        run: >-
          python scripts/archive_water_levels.py --skip-recent
          --hourly-config fetcher/config/stations.json
          --source-base fetcher/data/stations
      - name: Commit hourly archive changes
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if ! git diff --cached --quiet; then
            git commit -m "Sync hourly river water levels"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push
          fi
      - name: Upload Pages artifact (one-day retention)
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
          retention-days: 1

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy live data
        id: deployment
        uses: actions/deploy-pages@v4
