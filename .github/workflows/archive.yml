name: Archive river water levels

on:
  workflow_dispatch:
  # 定期起動は Cloudflare Worker(kuji-waterlevel-scheduler)の Cron "25 18 * * *" から workflow_dispatch で行う。
  # GitHub の schedule は起動が不規則なため使わない(Cloudflare が止まれば更新も止まる)。

permissions:
  contents: write

concurrency:
  group: archive-river-water-levels
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Archive completed 10-minute days
        run: python scripts/archive_water_levels.py --skip-hourly
      - name: Commit immutable archives
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if ! git diff --cached --quiet; then
            git commit -m "Archive river water levels"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push
          fi
