name: Import Nukada observations

on:
  workflow_dispatch:
    inputs:
      observations:
        description: 'アプリで保存した nukada-import.json の内容'
        required: true
        type: string
      verified:
        description: '公式ページの地点・観測日時・水位と既存データの基準面を確認した'
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: archive-river-water-levels
  cancel-in-progress: false

jobs:
  import:
    if: github.ref == 'refs/heads/main' && inputs.verified
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate and save the observations
        env:
          OBSERVATIONS: ${{ inputs.observations }}
        run: |
          printf '%s' "$OBSERVATIONS" > "$RUNNER_TEMP/nukada-import.json"
          git pull --ff-only origin main
          python scripts/import_nukada.py "$RUNNER_TEMP/nukada-import.json" --write
          git add -- data/manual
          if ! git diff --cached --quiet; then
            git -c user.name=github-actions[bot] -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -m "Import verified Nukada observations"
            git push origin HEAD:main
          fi
