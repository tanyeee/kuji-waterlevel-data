name: Sync hourly river water levels

on:
  workflow_dispatch:
  schedule:
    - cron: "35 * * * *"

permissions:
  contents: write

concurrency:
  group: archive-river-water-levels
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install source dependencies
        run: python -m pip install -r fetcher/requirements.txt
      - name: Fetch current hourly observations from the monthly table
        working-directory: fetcher
        run: python scripts/update_recent_from_monthly_page.py
      - name: Fetch current hourly observations for Kawabou-only stations
        working-directory: fetcher
        run: python scripts/update_recent_from_kawabou_files.py --keep-10min-hours 168 --keep-hourly-days 45
      - name: Merge recent hourly readings into annual archives
        run: >-
          python scripts/archive_water_levels.py --skip-recent
          --hourly-config fetcher/config/stations.json
          --source-base fetcher/data/stations
      - name: Commit changes
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if ! git diff --cached --quiet; then
            git commit -m "Sync hourly river water levels"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push
          fi
