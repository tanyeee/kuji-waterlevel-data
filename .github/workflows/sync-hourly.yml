name: Sync hourly river water levels

on:
  workflow_dispatch:
  schedule:
    - cron: "35 * * * *"

permissions:
  contents: write

concurrency:
  group: archive-river-water-levels
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Checkout the old viewer's fetch script and station config
        uses: actions/checkout@v4
        with:
          repository: tanyeee/kuji-waterlevel
          ref: main
          path: viewer
          fetch-depth: 1
          persist-credentials: false
      - name: Install source dependencies
        run: python -m pip install -r viewer/requirements.txt
      - name: Fetch current hourly observations
        working-directory: viewer
        run: python scripts/update_recent_from_monthly_page.py
      - name: Merge recent hourly readings into annual archives
        run: >-
          python scripts/archive_water_levels.py --skip-recent
          --hourly-config viewer/config/stations.json
          --source-base viewer/data/stations
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if ! git diff --cached --quiet; then
            git commit -m "Sync hourly river water levels"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push
          fi
