name: Sync hourly fallback

on:
  workflow_dispatch:
  schedule:
    - cron: "45 18 * * 0"

permissions:
  contents: write

concurrency:
  group: archive-river-water-levels
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Sync hourly fallback
        run: python scripts/archive_water_levels.py --skip-recent
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if ! git diff --cached --quiet; then
            git commit -m "Sync hourly river water levels"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push
          fi
